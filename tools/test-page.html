<!DOCTYPE html><html><head><title>Deck CDP Test Page</title></head>
<body><h1 id="h">hello</h1><video id="v"></video><script>
window.marker = 'ready';
// 可定位的本地音频，让 CDP 自检验证真实 seek，而非给无媒体的 video 赋 currentTime。
const size = 8000 * 30 * 2;
const bytes = new Uint8Array(44 + size);
const view = new DataView(bytes.buffer);
const text = (offset, value) => [...value].forEach((c, i) => { bytes[offset + i] = c.charCodeAt(0); });
text(0, 'RIFF'); view.setUint32(4, 36 + size, true); text(8, 'WAVEfmt ');
view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
view.setUint32(24, 8000, true); view.setUint32(28, 16000, true);
view.setUint16(32, 2, true); view.setUint16(34, 16, true);
text(36, 'data'); view.setUint32(40, size, true);
document.querySelector('video').src = URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }));
</script></body></html>
